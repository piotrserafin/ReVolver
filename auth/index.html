<!DOCTYPE html>
<html lang="en">
<head>
  <title>ReVolver - Volvo Auth</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-auth">
  <div class="logo">ReVolver</div>
  <div class="subtitle">Volvo Connected Vehicle for Pebble</div>
  <p id="status" role="status" aria-live="polite"></p>
  <div id="action"></div>
  <div class="guide-link"><a href="setup.html">Setup guide</a> · <a href="license.html">License</a> · <a href="diag.html">Diagnostics</a></div>

  <noscript>
    <div class="noscript">JavaScript is required for Volvo ID authentication.</div>
  </noscript>

  <script>
    var LAMBDA_URL = 'https://tpl5qhrn75bxzps77pdqllhxuy0mckgw.lambda-url.eu-central-1.on.aws/';
    var VOLVO_ACCOUNT_URL = 'https://auth.volvocars.com/realms/volvocars/account';
    // Legacy Volvo ID and Keycloak (Volvo ID migration, deadline 2027-01-31)
    var ALLOWED_AUTH_ORIGINS = ['https://volvoid.eu.volvocars.com/', 'https://auth.volvocars.com/'];

    function isAllowedAuthEndpoint(url) {
      for (var i = 0; i < ALLOWED_AUTH_ORIGINS.length; i++) {
        if (url.indexOf(ALLOWED_AUTH_ORIGINS[i]) === 0) return true;
      }
      return false;
    }

    var $status = document.getElementById('status');
    var $action = document.getElementById('action');

    // --- Utilities ---

    function param(name) {
      var m = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
      return m ? decodeURIComponent(m[1]) : null;
    }

    function randomString(len) {
      var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
      var arr = new Uint8Array(len);
      crypto.getRandomValues(arr);
      var result = '';
      for (var i = 0; i < len; i++) {
        result += chars[arr[i] & 63];
      }
      return result;
    }

    function sha256Base64url(str) {
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str))
        .then(function(buf) {
          return btoa(String.fromCharCode.apply(null, new Uint8Array(buf)))
            .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
        });
    }

    function request(method, url, body, cb) {
      var xhr = new XMLHttpRequest();
      xhr.open(method, url);
      if (body) xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
      xhr.onload = function() { cb(null, xhr.status, xhr.responseText); };
      xhr.onerror = function() { cb('Network error'); };
      xhr.send(body || null);
    }

    function showLoading(msg) {
      var spinner = document.createElement('span');
      spinner.className = 'spinner';
      $status.textContent = '';
      $status.appendChild(spinner);
      $status.appendChild(document.createTextNode(msg));
    }

    function addInfo(text, cls) {
      var div = document.createElement('div');
      div.className = cls || 'info';
      div.textContent = text;
      $action.appendChild(div);
      return div;
    }

    function clearAction() {
      while ($action.firstChild) $action.removeChild($action.firstChild);
    }

    function showError(title, detail) {
      $status.textContent = title;
      var container = document.createElement('div');
      if (detail) {
        var errDiv = document.createElement('div');
        errDiv.className = 'error';
        errDiv.textContent = detail;
        container.appendChild(errDiv);
      }
      var retryLink = document.createElement('a');
      retryLink.className = 'btn';
      retryLink.href = location.pathname;
      retryLink.textContent = 'Try Again';
      container.appendChild(retryLink);
      clearAction();
      $action.appendChild(container);
    }

    // --- OAuth Flow ---

    var code = param('code');
    var error = param('error');
    var returnedState = param('state');

    // Volvo's login is blank in the Pebble settings webview, so the login runs in the
    // phone's browser and PebbleKit JS collects the tokens from the Lambda via the pairing.
    var PAIR_RE = /^[A-Za-z0-9_-]{16,64}$/;
    var pair = param('pair');
    if (pair && !PAIR_RE.test(pair)) pair = null;

    function inPebbleWebview() {
      return !!(window.Pebble && typeof window.Pebble.openUrl === 'function');
    }

    // Kept across the Volvo round trip (redirect_uri has no ?pair). A start without ?pair drops a
    // stale one, so a later normal login can't feed an old pairing.
    if (pair && !inPebbleWebview()) sessionStorage.setItem('pair', pair);
    else if (!code && !error) sessionStorage.removeItem('pair');

    // Keep the login code, state and pairing out of the address bar and history. The Pebble
    // settings page keeps ?pair, so a reload there still knows the pairing.
    if (code || error || (pair && !inPebbleWebview())) {
      history.replaceState(null, '', location.pathname);
    }

    if (code) {
      exchangeToken();
    } else if (error) {
      showError('Authorization error', param('error_description') || error);
    } else {
      init();
    }

    // Step 1: Fetch config from Lambda, show login button
    function init() {
      showLoading('Loading...');
      request('GET', LAMBDA_URL, null, function(err, status, body) {
        if (err || status !== 200) {
          return showError('Cannot reach auth server', err || body);
        }
        var cfg;
        try { cfg = JSON.parse(body); }
        catch (e) { return showError('Invalid server response', 'Expected JSON from auth server.'); }

        if (!cfg.client_id || !cfg.redirect_uri || !cfg.scopes || !cfg.auth_endpoint) {
          return showError('Invalid config', 'Missing required fields from auth server.');
        }
        if (!isAllowedAuthEndpoint(cfg.auth_endpoint)) {
          return showError('Invalid config', 'Untrusted auth endpoint.');
        }

        $status.textContent = 'Connect your Volvo account';
        clearAction();

        if (pair && inPebbleWebview()) return showBrowserLogin(cfg);

        var btn = document.createElement('button');
        btn.className = 'btn';
        btn.type = 'button';
        btn.id = 'loginBtn';
        btn.textContent = 'Log in with Volvo ID';
        btn.onclick = function() { startAuth(cfg); };

        if (pair) {
          // A pairing link sends the login to whichever phone started it.
          addInfo('Continue only if you just tapped "Log in with Volvo ID" in ReVolver settings ' +
            'in the Pebble app on this phone. Never use a login link someone sent you.', 'warn');
        }
        $action.appendChild(btn);

        var info = document.createElement('div');
        info.className = 'info';
        info.textContent = "You'll be redirected to Volvo's secure login page.";
        $action.appendChild(info);
      });
    }

    function showBrowserLogin(cfg) {
      var btn = document.createElement('button');
      btn.className = 'btn';
      btn.type = 'button';
      btn.textContent = 'Log in with Volvo ID in browser';
      btn.onclick = function() {
        var url = location.protocol + '//' + location.host + location.pathname +
          '?pair=' + encodeURIComponent(pair);
        window.Pebble.openUrl(url).then(function(opened) {
          if (!opened) return;
          showConfirmForm();
        }, function(err) {
          showError('Could not open the browser', String(err && (err.message || err)));
        });
      };
      $action.appendChild(btn);

      var info = document.createElement('div');
      info.className = 'info';
      info.textContent = "Volvo's login page doesn't work inside the Pebble app, so it opens in your browser.";
      $action.appendChild(info);

      // Old in-webview login: works again once the Pebble app is fixed
      var here = document.createElement('a');
      here.className = 'alt-login';
      here.href = '#';
      here.textContent = 'Log in here instead';
      here.onclick = function(e) { e.preventDefault(); startAuth(cfg); };
      $action.appendChild(here);
    }

    // Pebble settings page: the code shown in the browser after the Volvo login
    // releases the tokens to this phone's ReVolver.
    function showConfirmForm(message) {
      $status.textContent = 'Log in in your browser, then enter the code it shows';
      clearAction();
      if (message) addInfo(message, 'error');

      var input = document.createElement('input');
      input.className = 'confirm-input';
      input.type = 'text';
      input.maxLength = 8;
      input.autocomplete = 'off';
      input.autocapitalize = 'characters';
      input.spellcheck = false;
      input.placeholder = 'XXXXXX';
      input.setAttribute('aria-label', 'Code from the browser');
      $action.appendChild(input);

      var btn = document.createElement('button');
      btn.className = 'btn';
      btn.type = 'button';
      btn.textContent = 'Confirm';
      btn.onclick = function() { sendConfirm(input.value); };
      $action.appendChild(btn);

      addInfo('Keep this page open while you log in. Keep the ReVolver app open on your watch.');

      var close = document.createElement('a');
      close.className = 'alt-login';
      close.href = 'pebblejs://close';
      close.textContent = 'Cancel';
      $action.appendChild(close);
    }

    function sendConfirm(value) {
      value = value.replace(/[\s-]/g, '').toUpperCase();
      if (value.length !== 6) return showConfirmForm('The code has 6 letters and digits.');
      showLoading('Checking code...');
      request('POST', LAMBDA_URL,
        'action=pair_confirm&code=' + encodeURIComponent(pair) + '&confirm=' + encodeURIComponent(value),
        function(err, status, body) {
          if (err) return showConfirmForm('Network error, try again.');
          if (status === 200) {
            $status.textContent = 'Logged in!';
            clearAction();
            addInfo('Your watch shows "Ready" in a few seconds.');
            var done = document.createElement('a');
            done.className = 'btn btn-success';
            done.href = 'pebblejs://close';
            done.textContent = 'Return to Pebble';
            $action.appendChild(done);
            return;
          }
          if (status === 403) {
            var left = 0;
            try { left = JSON.parse(body).attempts_left; } catch (e) {}
            return showConfirmForm('Wrong code. ' + left + (left === 1 ? ' try' : ' tries') + ' left.');
          }
          if (status === 400) return showConfirmForm('That doesn\'t look like the code. Check it in your browser.');
          showError('Login expired', 'Close this page, open ReVolver settings again and log in again.');
        });
    }

    // Step 2: Redirect to Volvo ID
    function startAuth(cfg) {
      var verifier = randomString(64);
      var state = randomString(32);
      sessionStorage.setItem('pkce_verifier', verifier);
      sessionStorage.setItem('oauth_state', state);

      sha256Base64url(verifier).then(function(challenge) {
        location.href = cfg.auth_endpoint +
          '?response_type=code' +
          '&client_id=' + encodeURIComponent(cfg.client_id) +
          '&redirect_uri=' + encodeURIComponent(cfg.redirect_uri) +
          '&scope=' + encodeURIComponent(cfg.scopes) +
          '&state=' + encodeURIComponent(state) +
          '&code_challenge=' + encodeURIComponent(challenge) +
          '&code_challenge_method=S256';
      });
    }

    // Step 3: Exchange code for tokens via AWS Lambda
    function exchangeToken() {
      var verifier = sessionStorage.getItem('pkce_verifier');
      var savedState = sessionStorage.getItem('oauth_state');

      if (!savedState || returnedState !== savedState) {
        sessionStorage.removeItem('pkce_verifier');
        sessionStorage.removeItem('oauth_state');
        return showError('Security error', 'State mismatch or session expired.');
      }
      if (!verifier) {
        sessionStorage.removeItem('oauth_state');
        return showError('Session expired', 'Please try again.');
      }

      showLoading('Exchanging code for token...');

      var pairCode = sessionStorage.getItem('pair');
      var body = 'grant_type=authorization_code' +
        '&code=' + encodeURIComponent(code) +
        '&code_verifier=' + encodeURIComponent(verifier) +
        (pairCode ? '&pair=' + encodeURIComponent(pairCode) : '');

      request('POST', LAMBDA_URL, body, function(err, status, resp) {
        sessionStorage.removeItem('pkce_verifier');
        sessionStorage.removeItem('oauth_state');
        if (err) return showError('Network error', err);
        if (pairCode) sessionStorage.removeItem('pair');
        if (pairCode && status === 410) {
          return showError('Login link expired', 'Open ReVolver settings in the Pebble app and try again.');
        }
        if (status !== 200) {
          try { var e = JSON.parse(resp); return showError('Token error: ' + status, e.detail || e.error || resp); }
          catch (x) { return showError('Token error: ' + status, resp); }
        }

        var data;
        try { data = JSON.parse(resp); }
        catch (e) { return showError('Invalid token response', 'Server returned non-JSON.'); }

        if (pairCode) {
          // No token payload: ReVolver collects the tokens once the code is entered there
          if (!data.confirm_code) return showError('Invalid server response', 'No confirmation code.');
          $status.textContent = 'Almost done: enter this code in the Pebble app';
          clearAction();
          var codeEl = document.createElement('div');
          codeEl.className = 'confirm-code';
          codeEl.textContent = data.confirm_code;
          $action.appendChild(codeEl);
          addInfo('Go back to the Pebble app and type this code in ReVolver settings. ' +
            'It works for a few minutes.');
          addInfo('Never share this code. ReVolver never asks for it by message, email or on ' +
            'another website. If you didn\'t start this login yourself, close this page.', 'warn');
          var revoke = document.createElement('a');
          revoke.className = 'alt-login';
          revoke.href = VOLVO_ACCOUNT_URL;
          revoke.textContent = 'Didn\'t start this? Review access in your Volvo ID account';
          $action.appendChild(revoke);
          return;
        }

        var payload = JSON.stringify({
          ACCESS_TOKEN: data.access_token,
          REFRESH_TOKEN: data.refresh_token || '',
          EXPIRES_IN: data.expires_in || 3600,
          VCC_API_KEY: data.vcc_api_key || ''
        });

        $status.textContent = 'Connected to Volvo!';
        clearAction();

        var link = document.createElement('a');
        link.className = 'btn btn-success';
        link.href = 'pebblejs://close#' + encodeURIComponent(payload);
        link.textContent = 'Return to Pebble';
        $action.appendChild(link);
      });
    }
  </script>
</body>
</html>
