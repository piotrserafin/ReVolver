name: Build & Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # No apt packages: those are for the emulator, and Ubuntu's mirror
      # sometimes makes that step take 10+ minutes. Same setup as ci.yml.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Install Pebble Tool
        run: uv tool install pebble-tool

      - name: Install Pebble SDK
        run: pebble sdk install latest

      - name: Build
        run: pebble build

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/ReVolver.pbw
          generate_release_notes: true
